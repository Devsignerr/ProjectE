<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>40강 문제풀이 — ProjectE 엔진 강의</title>
<style>
:root {
	--bg: #f7f6f2; --surface: #ffffff; --surface2: #f0eee8; --line: #d9d5cb;
	--text: #22211e; --muted: #6b675e; --accent: #b4532a; --accent-soft: #f6e3d8;
	--ok: #2e8a5f; --ok-soft: #dcf0e5; --bad: #c0434f; --bad-soft: #f7dfe1; --info: #2f6db5; --info-soft: #dde8f6;
	--code-bg: #f3f1ec;
	--shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		--bg: #17181b; --surface: #1f2125; --surface2: #282a2f; --line: #3a3d44;
		--text: #e8e6e1; --muted: #a09c93; --accent: #e58a5c; --accent-soft: #3b2a22;
		--ok: #6cc79a; --ok-soft: #1d3128; --bad: #ec8590; --bad-soft: #3a2125; --info: #78a9e6; --info-soft: #1f2b3b;
		--code-bg: #1a1c20; --shadow: none;
	}
}
:root[data-theme="dark"] {
	--bg: #17181b; --surface: #1f2125; --surface2: #282a2f; --line: #3a3d44;
	--text: #e8e6e1; --muted: #a09c93; --accent: #e58a5c; --accent-soft: #3b2a22;
	--ok: #6cc79a; --ok-soft: #1d3128; --bad: #ec8590; --bad-soft: #3a2125; --info: #78a9e6; --info-soft: #1f2b3b;
	--code-bg: #1a1c20; --shadow: none;
}
* { box-sizing: border-box; }
body {
	margin: 0; background: var(--bg); color: var(--text);
	font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
	font-size: 16px; line-height: 1.7; word-break: keep-all;
}
a { color: var(--accent); }
code { font-family: "Cascadia Code", Consolas, "D2Coding", monospace; font-size: .88em; background: var(--surface2); padding: 1px 6px; border-radius: 4px; }
pre.code { background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow-x: auto; font-family: "Cascadia Code", Consolas, "D2Coding", monospace; font-size: 13.5px; line-height: 1.6; margin: 10px 0 4px; tab-size: 4; }

.wrap { max-width: 820px; margin: 0 auto; padding: 32px 20px 120px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 14px; }
.top a { text-decoration: none; }
button.chip { font: inherit; font-size: 12.5px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer; }
button.chip:hover { border-color: var(--accent); }
header.hero .eyebrow { color: var(--accent); font-weight: 700; font-size: 14px; margin-top: 22px; }
header.hero h1 { font-size: 30px; line-height: 1.3; margin: 4px 0 8px; }
header.hero p { color: var(--muted); margin: 0 0 6px; }

.status {
	position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 0 10px; margin: 18px 0 8px;
	border-bottom: 1px solid var(--line); display: flex; gap: 16px; align-items: center; flex-wrap: wrap; font-size: 14px;
}
.status .bar { flex: 1 1 200px; height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; display: flex; }
.status .bar .ok { background: var(--ok); }
.status .bar .bad { background: var(--bad); }
.status b { font-size: 15px; }

.legend { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 0; }
.legend span { font-size: 12.5px; padding: 2px 9px; border-radius: 6px; background: var(--surface2); color: var(--muted); }

.q { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin: 18px 0; box-shadow: var(--shadow); scroll-margin-top: 70px; }
.q.correct { border-color: var(--ok); }
.q.wrong { border-color: var(--bad); }
.q .head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.q .no { font-weight: 800; color: var(--accent); }
.q .topic { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--surface2); color: var(--muted); }
.q .kind { font-size: 12px; color: var(--muted); margin-left: auto; }
.q .stem { font-weight: 600; margin: 8px 0 6px; }
.q ol.opts { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 8px; }
.q button.opt {
	width: 100%; text-align: left; font: inherit; color: var(--text); background: var(--surface);
	border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; cursor: pointer; display: flex; gap: 10px; line-height: 1.6;
}
.q button.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.q button.opt:disabled { cursor: default; }
.q button.opt .mark { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: var(--surface2); color: var(--muted); margin-top: 1px; }
.q button.opt.is-answer { border-color: var(--ok); background: var(--ok-soft); }
.q button.opt.is-answer .mark { background: var(--ok); color: var(--surface); }
.q button.opt.is-picked-wrong { border-color: var(--bad); background: var(--bad-soft); }
.q button.opt.is-picked-wrong .mark { background: var(--bad); color: var(--surface); }
.q button.opt.dim { opacity: .55; }
.feedback { margin-top: 14px; border-radius: 10px; padding: 12px 16px; font-size: 15px; }
.feedback.ok { background: var(--ok-soft); }
.feedback.bad { background: var(--bad-soft); }
.feedback .verdict { font-weight: 800; }
.feedback.ok .verdict { color: var(--ok); }
.feedback.bad .verdict { color: var(--bad); }
.feedback p { margin: 6px 0; }
.feedback .why-wrong { border-left: 3px solid var(--bad); padding-left: 10px; }
.feedback .review { font-size: 13.5px; margin-top: 8px; }

.result { background: var(--surface); border: 2px solid var(--accent); border-radius: 14px; padding: 20px 22px; margin-top: 30px; box-shadow: var(--shadow); }
.result h2 { margin: 0 0 4px; font-size: 22px; }
.result .score { font-size: 40px; font-weight: 800; color: var(--accent); line-height: 1.2; }
.result table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 14.5px; }
.result th, .result td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
.result th { background: var(--surface2); }
.result .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.result .actions a, .result .actions button { font: inherit; font-size: 14px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer; text-decoration: none; }
.result .actions .primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.hidden { display: none; }

@media (max-width: 600px) {
	.wrap { padding: 20px 16px 80px; }
	header.hero h1 { font-size: 24px; }
	.q { padding: 14px 14px; }
}
code, pre.code { font-variant-ligatures: none; } /* 코드 글꼴 합자(-> 를 화살표로) 끄기 */
</style>
</head>
<body>
<div class="wrap">
	<div class="top">
		<a href="Part06_Animation.html#lec-40">← 40강 강의로 돌아가기</a>
		<span><a href="Curriculum.html">커리큘럼</a> · <button class="chip" id="theme-btn" type="button">테마 전환</button></span>
	</div>

	<header class="hero">
		<div class="eyebrow">6부 · 40강 문제풀이</div>
		<h1>스켈레탈 애니메이션, 제대로 이해했나요?</h1>
		<p>40강의 여섯 주제(뼈 계층, 바인드 포즈, 키프레임, 스키닝, ProjectE 구현, 함정)를 모두 확인하는 객관식 문제입니다. 보기를 고르면 바로 채점되고, 고른 보기가 왜 맞는지 또는 왜 틀렸는지 설명이 나옵니다.</p>
		<div class="legend" id="legend"></div>
	</header>

	<div class="status" aria-live="polite">
		<span><b id="answered">0</b> / <span id="total">0</span> 풀이</span>
		<span>정답 <b id="correct">0</b></span>
		<div class="bar" aria-hidden="true"><div class="ok" id="bar-ok"></div><div class="bad" id="bar-bad"></div></div>
		<button class="chip" id="reset-btn" type="button">처음부터</button>
	</div>

	<div id="questions"></div>

	<section class="result hidden" id="result" aria-live="polite">
		<h2>결과</h2>
		<div class="score" id="result-score"></div>
		<p id="result-message"></p>
		<table>
			<thead><tr><th>주제</th><th>정답</th><th>다시 볼 곳</th></tr></thead>
			<tbody id="result-table"></tbody>
		</table>
		<div class="actions">
			<button type="button" id="retry-wrong" class="primary">틀린 문제만 다시 풀기</button>
			<button type="button" id="retry-all">전부 다시 풀기</button>
			<a href="Part06_Animation.html#lec-41">41강으로 →</a>
		</div>
	</section>
</div>

<script>
// 강의 주제 (강의 페이지의 절 앵커)
const Lesson = "Part06_Animation.html";
const Topics = {
	hierarchy: { name: "뼈 계층과 월드 행렬",      anchor: "lec-40-hierarchy" },
	bind:      { name: "바인드 포즈·역바인드",      anchor: "lec-40-bind" },
	keys:      { name: "키프레임 보간",            anchor: "lec-40-keys" },
	lbs:       { name: "선형 블렌드 스키닝",        anchor: "lec-40-lbs" },
	projecte:  { name: "ProjectE의 팔레트 흐름",    anchor: "lec-40-projecte" },
	pitfalls:  { name: "함정과 교훈",              anchor: "lec-40-pitfalls" },
};

// 문제: a = 정답 인덱스, w = 보기별 설명(정답 보기는 근거, 오답 보기는 왜 틀렸는지), code = 선택 코드
const Questions = [
	{
		t: "hierarchy", kind: "계산",
		q: "부모 뼈의 월드 행렬은 Yaw 90°(앞 +X를 오른쪽 +Y로 돌림) 뒤 (0, 0, 100) 이동입니다. 자식 뼈의 로컬 포즈는 회전 없이 (10, 0, 0) 이동뿐입니다. 자식 뼈 원점의 월드 위치는?",
		o: ["(10, 0, 100)", "(0, 10, 0)", "(0, 10, 100)", "(0, −10, 100)"],
		a: 2,
		w: [
			"부모의 회전을 빼먹은 값입니다. 자식의 로컬 이동은 부모 기준이므로 부모가 돌면 함께 돌아갑니다.",
			"부모의 이동 (0, 0, 100)을 빼먹은 값입니다.",
			"월드 = 자식 로컬 × 부모 월드(행벡터 규약). 원점은 로컬로 (10, 0, 0) → 부모 회전으로 (0, 10, 0) → 부모 이동으로 (0, 10, 100)이 됩니다.",
			"회전 방향을 반대로(앞 → 왼쪽) 적용한 값입니다. Yaw +90°는 +X를 +Y로 돌립니다.",
		],
	},
	{
		t: "hierarchy", kind: "설계 이유",
		q: "클립이 각 뼈의 움직임을 모델 공간이 아니라 부모 기준(로컬)으로 저장하는 가장 중요한 이유는?",
		o: [
			"GPU 정점 셰이더가 부모 기준 행렬만 받을 수 있기 때문이다.",
			"로컬 값은 범위가 작아 키를 16비트로 압축해 저장할 수 있다.",
			"모델 공간 행렬은 역행렬을 구할 수 없어 역바인드를 만들 수 없다.",
			"어깨를 돌리면 아래쪽 뼈가 따라가고, 동작을 섞거나 고치기 쉽다.",
		],
		a: 3,
		w: [
			"셰이더가 받는 것은 이미 월드로 계산된 팔레트(InverseBind × JointWorld)입니다. 로컬 행렬은 CPU에서 사슬로 곱해 끝납니다.",
			"압축은 이 강의의 이유가 아닙니다. ProjectE의 채널 값은 `FVector4`(float)로 저장됩니다.",
			"모델 공간 행렬도 역행렬을 구할 수 있습니다. 역바인드 행렬 자체가 바인드 포즈 모델 공간 뼈 행렬의 역행렬입니다.",
			"손의 키에 어깨 회전까지 미리 섞어 두면 어깨만 바꾸거나 두 클립을 섞을 수 없습니다. 로컬로 저장하면 부모가 움직일 때 자식이 자동으로 따라가고, 클립끼리 뼈 단위로 섞거나 고칠 수 있습니다.",
		],
	},
	{
		t: "hierarchy", kind: "코드 읽기",
		q: "`ComputeModelMatrices`가 배열 순서대로 한 번 훑지 않고, 노드마다 조상 사슬을 따라 올라갔다가 내려오며 계산하는 이유는?",
		code: "OutMatrices[Current] = (Parent >= 0 && ...) ? Pose[Current].ToMatrix() * OutMatrices[Parent]\n                                         : Pose[Current].ToMatrix();",
		o: [
			"배열에서 부모가 자식보다 뒤에 올 수 있어 부모 행렬부터 구해야 한다.",
			"행벡터 규약이라 부모 행렬을 곱하는 순서를 거꾸로 뒤집어야 한다.",
			"뼈가 여러 부모를 가질 수 있어서 모든 부모 경로를 각각 돌아야 한다.",
			"루트에서 내려가며 계산해야 부동소수점 오차가 덜 쌓이고 안정되기 때문이다.",
		],
		a: 0,
		w: [
			"`OutMatrices[Parent]`를 쓰려면 부모 값이 먼저 계산돼 있어야 합니다. glTF 노드 배열은 부모가 앞에 온다는 보장이 없으므로, 조상 사슬을 따라 올라가 위에서부터 채웁니다.",
			"곱하는 순서(로컬 × 부모 월드)는 이 식이 이미 정하고 있습니다. 순회 방식과는 관계없습니다.",
			"뼈 계층은 트리입니다. 뼈마다 부모는 하나뿐입니다.",
			"곱셈 횟수는 같습니다. 문제는 오차가 아니라 부모 값이 준비돼 있느냐입니다.",
		],
	},
	{
		t: "bind", kind: "개념",
		q: "glTF 스킨이 뼈마다 담아 두는 역바인드 행렬(inverse bind matrix)이 정점에 하는 일은?",
		o: [
			"현재 포즈로 움직인 정점을 바인드 포즈 자세로 다시 되돌려 놓는다.",
			"바인드 포즈 모델 공간의 정점을 그 뼈 기준 좌표로 옮긴다.",
			"뼈의 로컬 포즈를 부모 기준에서 모델 공간으로 바꿔 준다.",
			"정점의 가중치 합이 1이 되도록 뼈 행렬을 정규화해 준다.",
		],
		a: 1,
		w: [
			"정점은 처음부터 바인드 포즈로 저장되어 있습니다. 되돌릴 필요가 없습니다.",
			"역바인드 = 바인드 포즈 때 뼈 행렬의 역행렬이라, 정점을 \"바인드 포즈 때 그 뼈에서 얼마나 떨어져 있었나\"로 바꿉니다. 그 뒤 지금의 조인트 월드 행렬을 곱하면 정점이 뼈를 따라 옮겨집니다.",
			"로컬 → 모델 공간은 계층을 따라 로컬 행렬을 곱하는 일(`ComputeModelMatrices`)입니다.",
			"가중치는 정점 스트림(`FSkinVertex::Weights`)에 이미 합 1로 저장됩니다. 역바인드와 관계없습니다.",
		],
	},
	{
		t: "bind", kind: "계산",
		q: "바인드 포즈에서 팔꿈치 뼈는 회전 없이 (0, 0, 100)에 있었고, 정점은 (5, 0, 120)입니다. 지금 팔꿈치는 같은 위치에서 Yaw 90°(+X → +Y)만 돌았습니다. 팔레트 = InverseBind × JointWorld로 옮긴 정점은?",
		o: ["(0, −5, 120)", "(0, 5, 20)", "(0, 5, 220)", "(0, 5, 120)"],
		a: 3,
		w: [
			"회전 방향을 반대로(+X → −Y) 적용한 값입니다. Yaw +90°는 +X를 +Y로 돌립니다.",
			"뼈 공간 좌표까지만 구하고 지금 조인트 월드의 이동을 빼먹은 값입니다.",
			"역바인드를 빼고 조인트 월드만 곱한 값입니다. 뼈 기준으로 바꾸지 않고 돌리면 원점 기준으로 돌아 엉뚱한 곳으로 갑니다.",
			"역바인드로 (5, 0, 20)(뼈 기준) → 회전으로 (0, 5, 20) → 뼈 위치 (0, 0, 100)을 더해 (0, 5, 120). 팔꿈치를 중심으로 돈 결과입니다.",
		],
	},
	{
		t: "bind", kind: "버그 찾기",
		q: "모델 루트를 (300, 0, 0)으로 옮겼더니 스킨 캐릭터만 (600, 0, 0)에 그려졌습니다. 정적 메시 소품은 제자리입니다. 가장 그럴듯한 원인은?",
		o: [
			"역바인드 행렬에 모델 루트의 이동이 미리 들어 있어 두 번 더해졌다.",
			"`UpdateTransforms` 트랜스폼 캐시가 루트 이동을 두 프레임 연속 적용했다.",
			"스킨 셰이더가 팔레트 결과에 메시 노드의 World 행렬을 또 곱했다.",
			"`FSkinVertex` 가중치 합이 2가 되어 이동이 두 배로 늘어났다.",
		],
		a: 2,
		w: [

// ---- 상태 ----
const StorageKey = "projecte-quiz-40";
let Picks = LoadPicks(); // 문제 번호 → 고른 보기 인덱스
let Filter = null;       // null이면 전체, 배열이면 그 번호만 표시

function LoadPicks()
{
	try
	{
		const Raw = JSON.parse(localStorage.getItem(StorageKey) || "{}");
		return typeof Raw === "object" && Raw !== null ? Raw : {};
	}
	catch (e) { return {}; }
}

function SavePicks()
{
	try { localStorage.setItem(StorageKey, JSON.stringify(Picks)); }
	catch (e) { /* 저장할 수 없는 환경이면 이번 방문 동안만 유지 */ }
}

// `코드` 표기를 <code>로 바꿔 넣는다 (textContent만 써서 안전)
function AppendRich(Parent, Text)
{
	Text.split(/(`[^`]+`)/).forEach(Part =>
	{
		if (Part.startsWith("`") && Part.endsWith("`") && Part.length > 1)
		{
			const C = document.createElement("code");
			C.textContent = Part.slice(1, -1);
			Parent.append(C);
		}
		else
		{
			// **굵게** 표기
			Part.split(/(\*\*[^*]+\*\*)/).forEach(Sub =>
			{
				if (Sub.startsWith("**") && Sub.endsWith("**") && Sub.length > 4)
				{
					const B = document.createElement("b");
					B.textContent = Sub.slice(2, -2);
					Parent.append(B);
				}
				else if (Sub)
				{
					Parent.append(document.createTextNode(Sub));
				}
			});
		}
	});
	return Parent;
}

function El(Tag, Class)
{
	const Node = document.createElement(Tag);
	if (Class) Node.className = Class;
	return Node;
}

const Letters = ["①", "②", "③", "④", "⑤"];

// 보기 표시 순서: 문제 번호로 정해지는 고정 순열 (정답 위치가 고르게 나뉘도록 고른 씨앗).
// 데이터의 a/w는 원래 순서 기준이고, 화면 번호(①~④)만 이 순서를 따른다
const ShuffleSalt = 3435;
function OptionOrder(Index, Count)
{
	let Seed = (Math.imul(Index, 2654435761) + ShuffleSalt * 97 + 12345) >>> 0;
	const Order = [...Array(Count).keys()];
	for (let K = Count - 1; K > 0; --K)
	{
		Seed = (Math.imul(Seed, 1664525) + 1013904223) >>> 0;
		const J = (Seed >>> 16) % (K + 1); // 상위 비트 (LCG 하위 비트는 주기가 짧다)
		[Order[K], Order[J]] = [Order[J], Order[K]];
	}
	return Order; // Order[화면 위치] = 원래 보기 번호
}

function DisplayLetter(Index, Count, Original)
{
	return Letters[OptionOrder(Index, Count).indexOf(Original)];
}

function RenderQuestion(Q, Index)
{
	const Card = El("article", "q");
	Card.id = `q${Index + 1}`;
	const Head = El("div", "head");
	const No = El("span", "no"); No.textContent = `문제 ${Index + 1}`;
	const Topic = El("span", "topic"); Topic.textContent = Topics[Q.t].name;
	const Kind = El("span", "kind"); Kind.textContent = Q.kind;
	Head.append(No, Topic, Kind);
	Card.append(Head, AppendRich(El("div", "stem"), Q.q));
	if (Q.code)
	{
		const Pre = El("pre", "code");
		Pre.textContent = Q.code;
		Card.append(Pre);
	}
	const List = El("ol", "opts");
	const Buttons = new Array(Q.o.length);
	OptionOrder(Index, Q.o.length).forEach((OptIndex, Position) =>
	{
		const Li = El("li");
		const Btn = El("button", "opt");
		Btn.type = "button";
		const Mark = El("span", "mark"); Mark.textContent = Letters[Position];
		Btn.append(Mark, AppendRich(El("span"), Q.o[OptIndex]));
		Btn.addEventListener("click", () => Pick(Index, OptIndex));
		Li.append(Btn);
		List.append(Li);
		Buttons[OptIndex] = Btn; // 원래 보기 번호로 찾는다
	});
	Card.append(List);
	const Feedback = El("div", "feedback hidden");
	Card.append(Feedback);

	const Picked = Picks[Index];
	if (Picked !== undefined) ShowAnswer(Q, Index, Card, Buttons, Feedback, Picked);
	return Card;
}

function ShowAnswer(Q, Index, Card, Buttons, Feedback, Picked)
{
	const Answer = DisplayLetter(Index, Q.o.length, Q.a);
	const Chosen = DisplayLetter(Index, Q.o.length, Picked);
	const bCorrect = Picked === Q.a;
	Card.classList.add(bCorrect ? "correct" : "wrong");
	Buttons.forEach((Btn, I) =>
	{
		Btn.disabled = true;
		if (I === Q.a) Btn.classList.add("is-answer");
		else if (I === Picked) Btn.classList.add("is-picked-wrong");
		else Btn.classList.add("dim");
	});
	Feedback.className = "feedback " + (bCorrect ? "ok" : "bad");
	Feedback.replaceChildren();
	const Verdict = El("div", "verdict");
	Verdict.textContent = bCorrect ? `정답입니다 (${Answer})` : `오답입니다. 정답은 ${Answer}`;
	Feedback.append(Verdict);
	if (!bCorrect)
	{
		const Wrong = El("p", "why-wrong");
		Wrong.append(document.createTextNode(`고른 ${Chosen}: `));
		AppendRich(Wrong, Q.w[Picked]);
		Feedback.append(Wrong);
	}
	const Why = El("p");
	Why.append(document.createTextNode(bCorrect ? "" : `정답 ${Answer}: `));
	AppendRich(Why, Q.w[Q.a]);
	Feedback.append(Why);
	const Review = El("div", "review");
	const Link = El("a");
	Link.href = `${Lesson}#${Topics[Q.t].anchor}`;
	Link.textContent = `강의에서 다시 보기: ${Topics[Q.t].name} →`;
	Review.append(Link);
	Feedback.append(Review);
}

function Pick(Index, OptIndex)
{
	if (Picks[Index] !== undefined) return;
	Picks[Index] = OptIndex;
	SavePicks();
	Render();
	const Card = document.getElementById(`q${Index + 1}`);
	Card?.querySelector(".feedback")?.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function Render()
{
	const Container = document.getElementById("questions");
	Container.replaceChildren();
	Questions.forEach((Q, I) =>
	{
		if (Filter && !Filter.includes(I)) return;
		Container.append(RenderQuestion(Q, I));
	});
	UpdateStatus();
}

function UpdateStatus()
{
	const Visible = Questions.map((_, I) => I).filter(I => !Filter || Filter.includes(I));
	const Answered = Visible.filter(I => Picks[I] !== undefined);
	const Correct = Answered.filter(I => Picks[I] === Questions[I].a);
	document.getElementById("total").textContent = Visible.length;
	document.getElementById("answered").textContent = Answered.length;
	document.getElementById("correct").textContent = Correct.length;
	document.getElementById("bar-ok").style.width = `${(Correct.length / Visible.length) * 100}%`;
	document.getElementById("bar-bad").style.width = `${((Answered.length - Correct.length) / Visible.length) * 100}%`;

	const Result = document.getElementById("result");
	if (Answered.length < Visible.length)
	{
		Result.classList.add("hidden");
		return;
	}
	Result.classList.remove("hidden");
	const AllCorrect = Questions.filter((Q, I) => Picks[I] === Q.a).length;
	const Ratio = AllCorrect / Questions.length;
	document.getElementById("result-score").textContent = `${AllCorrect} / ${Questions.length}`;
	document.getElementById("result-message").textContent =
		Ratio === 1 ? "모두 맞혔습니다. 40강을 확실히 이해했습니다. 41강으로 넘어가도 좋습니다." :
		Ratio >= 0.8 ? "거의 다 이해했습니다. 아래 표에서 틀린 주제만 다시 보고 넘어가세요." :
		Ratio >= 0.6 ? "큰 흐름은 잡았지만 빈 곳이 있습니다. 틀린 주제의 절을 다시 읽고 틀린 문제를 다시 풀어 보세요." :
		"40강을 한 번 더 읽고 다시 풀어 보는 것을 권합니다. 특히 아래 표에서 정답률이 낮은 주제를 중심으로 보세요.";

	const Body = document.getElementById("result-table");
	Body.replaceChildren();
	for (const [Key, Topic] of Object.entries(Topics))
	{
		const Indices = Questions.map((Q, I) => (Q.t === Key ? I : -1)).filter(I => I >= 0);
		if (Indices.length === 0) continue;
		const Ok = Indices.filter(I => Picks[I] === Questions[I].a).length;
		const Tr = El("tr");
		const Td1 = El("td"); Td1.textContent = Topic.name;
		const Td2 = El("td"); Td2.textContent = `${Ok} / ${Indices.length}`;
		const Td3 = El("td");
		if (Ok < Indices.length)
		{
			const A = El("a");
			A.href = `${Lesson}#${Topic.anchor}`;
			A.textContent = "강의 절 다시 보기";
			Td3.append(A);
		}
		else
		{
			Td3.textContent = "✓";
		}
		Tr.append(Td1, Td2, Td3);
		Body.append(Tr);
	}
	document.getElementById("retry-wrong").disabled = AllCorrect === Questions.length;
}

document.getElementById("retry-wrong").addEventListener("click", () =>
{
	const Wrong = Questions.map((Q, I) => (Picks[I] !== Q.a ? I : -1)).filter(I => I >= 0);
	if (Wrong.length === 0) return;
	Wrong.forEach(I => delete Picks[I]);
	Filter = Wrong;
	SavePicks();
	Render();
	window.scrollTo({ top: 0, behavior: "smooth" });
});

function ResetAll()
{
	Picks = {};
	Filter = null;
	SavePicks();
	Render();
	window.scrollTo({ top: 0, behavior: "smooth" });
}
document.getElementById("retry-all").addEventListener("click", ResetAll);
document.getElementById("reset-btn").addEventListener("click", ResetAll);

// 주제 범례
(function ()
{
	const Legend = document.getElementById("legend");
	for (const [Key, Topic] of Object.entries(Topics))
	{
		const Count = Questions.filter(Q => Q.t === Key).length;
		const Span = El("span");
		Span.textContent = `${Topic.name} ${Count}문제`;
		Legend.append(Span);
	}
})();

// 테마 전환 (강의 페이지와 같은 저장 키)
(function ()
{
	const Root = document.documentElement;
	try
	{
		const Saved = localStorage.getItem("projecte-lectures-theme");
		if (Saved) Root.dataset.theme = Saved;
	}
	catch (e) {}
	document.getElementById("theme-btn").addEventListener("click", () =>
	{
		const IsDark = Root.dataset.theme ? Root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
		Root.dataset.theme = IsDark ? "light" : "dark";
		try { localStorage.setItem("projecte-lectures-theme", Root.dataset.theme); } catch (e) {}
	});
})();

Render();
</script>
</body>
</html>
